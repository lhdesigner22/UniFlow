<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UniFlow</title>
    <meta name="theme-color" content="#061826" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'><rect width='40' height='40' rx='9' fill='%233B82F6'/><path d='M20 4L32 12V28L20 36L8 28V12L20 4Z' stroke='white' stroke-width='2.5' stroke-linejoin='round' fill='none'/><path d='M20 12V20L26 24' stroke='white' stroke-width='2.5' stroke-linecap='round' fill='none'/></svg>"/>
    <!-- PWA: instalável no computador e no celular (o link do manifest e o
         registro do service worker são injetados automaticamente no build
         pelo vite-plugin-pwa — ver vite.config.js). O iOS/Safari ignora boa
         parte do manifest, então essas tags Apple continuam necessárias à parte. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="UniFlow" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Tema antes do React renderizar (evita flash) e fechamento rápido do
         popup do Google. Em arquivos de public/ (não inline) para a
         Content-Security-Policy poder proibir scripts inline — ver public/_headers. -->
    <script src="/theme-init.js"></script>
    <script src="/oauth-callback.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
