<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PARISFE UniFECAF</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,500;1,6..96,400&family=Hanken+Grotesk:wght@400;500;600&display=swap">
<style>
/* Layout: palco de vitrine de museu — logo dentro de um anel de luz no centro, nome do valor
   em serifa grande atravessando o anel, faixas verticais finas; o anel é o relógio do slide. */
:root {
  --bg: #04080d;          /* noite com viés do azul da marca */
  --bg-glow: #0a3f6a;     /* azul UniFECAF aceso, só como luz de fundo */
  --navy: #014b79;        /* azul da logo */
  --green: #1bb266;       /* verde da logo */
  --ink: #eef3f7;         /* texto principal */
  --muted: #8a9aab;       /* texto de apoio */
  --hair: rgba(170, 196, 222, .09); /* linhas finas */
  --display: "Bodoni Moda", "Didot", "Bodoni 72", Georgia, serif;
  --body: "Hanken Grotesk", "Segoe UI", system-ui, sans-serif;
  --slide-ms: 10000;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--body);
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
:focus-visible { outline: 2px solid var(--green); outline-offset: 4px; border-radius: 2px; }

.stage {
  position: relative;
  height: 100%;
  display: grid;
  grid-template-rows: auto 1fr auto;
  padding-block: clamp(18px, 3.2vh, 40px);
  padding-left: max(clamp(18px, 4vw, 64px), env(safe-area-inset-left, 0px));
  padding-right: max(clamp(18px, 4vw, 64px), env(safe-area-inset-right, 0px));
  isolation: isolate;
}
/* luz azul atrás do anel */
.stage::before {
  content: "";
  position: absolute; inset: 0;
  background: radial-gradient(ellipse 46% 58% at 50% 50%, color-mix(in srgb, var(--bg-glow) 70%, transparent), transparent 72%);
  z-index: -2;
}
/* faixas verticais finas, como colunas de vitrine */
.stage::after {
  content: "";
  position: absolute; inset: 0;
  background-image: linear-gradient(to right, var(--hair) 1px, transparent 1px);
  background-size: calc(100% / 6) 100%;
  background-position: calc(100% / 12) 0;
  z-index: -1;
  pointer-events: none;
}

/* ── topo ── */
.top { display: flex; align-items: center; justify-content: space-between; gap: 24px; }
.brand { display: flex; align-items: center; gap: 12px; font-family: var(--display); font-size: clamp(15px, 1.25vw, 22px); letter-spacing: .14em; text-transform: uppercase; }
.brand svg { width: clamp(22px, 1.8vw, 32px); height: auto; }
.letters { display: flex; gap: clamp(10px, 2.2vw, 40px); }
.letters button {
  position: relative;
  font-size: clamp(12px, 1vw, 20px);
  font-weight: 600;
  letter-spacing: .22em;
  color: var(--muted);
  padding: 8px 2px;
  transition: color .3s ease;
}
.letters button::after {
  content: "";
  position: absolute; left: 2px; right: calc(2px + .22em); bottom: 0;
  height: 2px; background: var(--green);
  transform: scaleX(0); transform-origin: left;
  transition: transform .5s cubic-bezier(.2, .7, .2, 1);
}
.letters button[aria-current="true"] { color: var(--ink); }
.letters button[aria-current="true"]::after { transform: scaleX(1); }
.letters button:hover { color: var(--ink); }
.tools { display: flex; align-items: center; gap: 6px; }
.tools button { width: 40px; height: 40px; display: grid; place-items: center; color: var(--muted); border-radius: 50%; transition: color .2s, background .2s; }
.tools button:hover { color: var(--ink); background: rgba(255, 255, 255, .06); }
.tools svg { width: 18px; height: 18px; }

/* ── centro ── */
.center { position: relative; display: grid; place-items: center; min-height: 0; }
.halo {
  position: relative;
  width: min(54vh, 40vw);
  aspect-ratio: 1;
  max-width: 100%;
}
.halo .ring { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.ring .track { fill: none; stroke: rgba(238, 243, 247, .10); stroke-width: 1.2; }
.ring .glow { fill: none; stroke: var(--ink); stroke-width: 3.2; stroke-linecap: round; filter: drop-shadow(0 0 6px rgba(255,255,255,.85)) drop-shadow(0 0 22px rgba(120,190,255,.55)); }
.logo {
  position: absolute; inset: 22%;
  display: grid; place-items: center;
  filter: drop-shadow(0 18px 40px rgba(0, 0, 0, .55)) drop-shadow(0 0 30px rgba(27, 178, 102, .18));
  animation: float 9s ease-in-out infinite;
}
.logo svg { width: 100%; height: auto; overflow: visible; }
.logo .frame { fill: var(--navy); }
.logo .core { fill: var(--green); transform-origin: 79px 62px; transition: transform .9s cubic-bezier(.2, .7, .2, 1); }
.logo.pulse .core { transform: scale(1.12); }
@keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-1.6%); } }

/* texto do valor: atravessa a metade de baixo do anel */
.copy {
  position: absolute;
  left: 50%; top: 50%;
  width: min(94vw, 1500px);
  transform: translate(-50%, 4%);
  display: grid;
  grid-template-columns: 1fr minmax(240px, 400px);
  align-items: end;
  gap: clamp(20px, 2.4vw, 44px);
  pointer-events: none;
}
.title {
  margin: 0;
  justify-self: end;
  text-align: right;
  font-family: var(--display);
  font-weight: 400;
  font-size: clamp(44px, 7.4vw, 136px);
  line-height: .92;
  letter-spacing: -.02em;
  text-wrap: balance;
  max-width: 11ch;
  text-shadow: 0 6px 40px rgba(4, 8, 13, .9);
}
.title.long { font-size: clamp(36px, 5.2vw, 96px); max-width: 13ch; }
.title .initial { color: var(--green); }
.aside { display: grid; gap: 14px; padding-bottom: .6em; max-width: 34ch; }
.aside p { margin: 0; color: var(--muted); font-size: clamp(14px, 1.2vw, 24px); line-height: 1.5; }
.aside blockquote {
  margin: 0;
  font-family: var(--display);
  font-style: italic;
  font-size: clamp(17px, 1.6vw, 32px);
  line-height: 1.3;
  color: var(--ink);
  border-left: 1px solid var(--green);
  padding-left: 14px;
}

/* troca de valor: letras sobem, texto de apoio entra depois */
.title .w { display: inline-block; overflow: hidden; vertical-align: bottom; padding-bottom: .08em; }
.title .w > span { display: inline-block; transform: translateY(105%); transition: transform .9s cubic-bezier(.2, .7, .2, 1); }
.show .title .w > span { transform: translateY(0); }
.aside > * { opacity: 0; transform: translateY(10px); transition: opacity .7s ease .35s, transform .7s cubic-bezier(.2, .7, .2, 1) .35s; }
.show .aside > * { opacity: 1; transform: none; }
.show .aside > blockquote { transition-delay: .5s; }
.leaving .title .w > span { transform: translateY(-105%); transition-duration: .45s; transition-timing-function: cubic-bezier(.6, 0, .8, .3); }
.leaving .aside > * { opacity: 0; transition: opacity .3s ease; }

/* ── rodapé ── */
.bottom { display: flex; align-items: end; justify-content: space-between; gap: 24px; }
.tagline { font-family: var(--display); font-style: italic; font-size: clamp(15px, 1.3vw, 26px); color: var(--muted); }
.word { font-size: clamp(12px, .95vw, 18px); letter-spacing: .5em; font-weight: 600; color: var(--muted); }
.word b { color: var(--ink); font-weight: 600; }
.count { font-variant-numeric: tabular-nums; font-size: clamp(13px, 1.05vw, 20px); letter-spacing: .12em; color: var(--muted); }
.count b { color: var(--ink); font-weight: 600; }

.hint {
  position: absolute; left: 50%; bottom: calc(clamp(18px, 3.2vh, 40px) + 44px);
  transform: translateX(-50%);
  font-size: 12px; color: var(--muted); letter-spacing: .08em;
  opacity: 0; transition: opacity .6s ease;
  pointer-events: none;
}
.hint.on { opacity: .8; }

/* celular / tela em pé: anel em cima, texto embaixo, sem sobrepor */
@media (max-width: 820px), (max-aspect-ratio: 1/1) {
  body { overflow: auto; }
  .stage { height: auto; min-height: 100%; }
  .letters { display: none; }
  .center { display: flex; flex-direction: column; gap: 28px; padding-block: 24px; }
  .halo { width: min(70vw, 46vh); }
  .copy { position: static; transform: none; width: 100%; grid-template-columns: 1fr; }
  .title, .title.long { justify-self: start; text-align: left; max-width: none; font-size: clamp(40px, 12vw, 72px); }
  .title.long { font-size: clamp(32px, 9vw, 56px); }
  .aside { max-width: 60ch; }
  .word { display: none; }
}

@media (prefers-reduced-motion: reduce) {
  .logo { animation: none; }
  .title .w > span, .leaving .title .w > span { transform: none !important; transition: none; }
  .aside > *, .leaving .aside > * { transform: none; transition: opacity .3s ease; }
}
</style>
</head>
<body>
<main class="stage" id="stage">
  <header class="top">
    <div class="brand">
      <svg viewBox="0 -17 160 160" aria-hidden="true"><g fill="#014b79"><path id="logoL" d="M24 0H128L108 20H38V88L14 112V10Q14 0 24 0Z"/><use href="#logoL" transform="rotate(180 79 62)"/></g><rect x="57" y="40" width="44" height="44" fill="#1bb266"/></svg>
      <span>UniFECAF</span>
    </div>
    <nav class="letters" id="letters" aria-label="Valores PARISFE"></nav>
    <div class="tools">
      <button type="button" id="pause" aria-label="Pausar">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>
      </button>
      <button type="button" id="full" aria-label="Tela cheia">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
      </button>
    </div>
  </header>

  <section class="center" aria-live="polite">
    <div class="halo">
      <svg class="ring" viewBox="0 0 100 100" aria-hidden="true">
        <circle class="track" cx="50" cy="50" r="48"/>
        <circle class="glow" id="glow" cx="50" cy="50" r="48" transform="rotate(-90 50 50)" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"/>
      </svg>
      <div class="logo" id="logo">
        <svg viewBox="0 -17 160 160" role="img" aria-label="Logo UniFECAF">
          <g class="frame"><path id="bigL" d="M24 0H128L108 20H38V88L14 112V10Q14 0 24 0Z"/><use href="#bigL" transform="rotate(180 79 62)"/></g>
          <rect class="core" x="57" y="40" width="44" height="44"/>
        </svg>
      </div>
    </div>
    <div class="copy" id="copy">
      <h1 class="title" id="title"></h1>
      <div class="aside">
        <p id="desc"></p>
        <blockquote id="quote"></blockquote>
      </div>
    </div>
  </section>

  <footer class="bottom">
    <span class="tagline">Seu sonho, nossa meta!</span>
    <span class="word" id="word" aria-hidden="true"></span>
    <span class="count" id="count"></span>
  </footer>
  <div class="hint" id="hint">← → para navegar · espaço pausa · F tela cheia</div>
</main>

<script src="/parisfe.js"></script>
</body>
</html>
